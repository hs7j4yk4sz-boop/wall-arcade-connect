<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>THE WALL ARCADE — admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
/* The games of games.json by status, for John (a wallet of ADMIN_WALLET on the card service): PUT IT ON THE HUB, HIDE, the
   order of the columns, EDIT, ATTACH again, a new capture. Linked from no page. hub/admin-page.ts does the rest. */
:root{--concrete:#DEDBD3;--ink:#0B0B0B;--chalk:#F2F0EB;--label:#6B685F;--rule:#C4C0B6;--blue:#2E7FD6;--green:#1F7A3A;--red:#B3261E;
  --anton:Anton,Impact,'Arial Narrow',sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--inter:Inter,system-ui,sans-serif;--padx:max(16px,4%)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--concrete);color:var(--ink)}
body{font-family:var(--inter);-webkit-font-smoothing:antialiased;overflow-x:hidden}
p,h1,h2,h3{margin:0}
a{color:inherit}
[hidden]{display:none !important}
.lbl{font:500 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.anton{font-family:var(--anton);font-weight:400;text-transform:uppercase;line-height:.9}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:1px solid var(--ink);cursor:pointer;text-decoration:none;
  font:400 17px/1 var(--anton);letter-spacing:.06em;text-transform:uppercase;background:var(--chalk);color:var(--ink)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.ink{background:var(--ink);color:var(--chalk)}
.btn:disabled{opacity:.5;cursor:wait}
main{max-width:1100px;margin:0 auto;padding:clamp(24px,4vw,48px) var(--padx) 64px}
h1{font-size:clamp(44px,7vw,84px);margin-top:12px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
.status:empty{display:none}
h2{font-size:clamp(28px,4vw,44px);margin-top:40px;border-top:1px solid var(--ink);padding-top:14px}
.list{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.g{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;padding:14px;border:1px solid var(--ink);background:var(--chalk)}
.g.focus{outline:3px solid var(--blue)}
.g img,.g .noshot{width:160px;height:160px;object-fit:cover;border:1px solid var(--ink);background:var(--ink)}
.g .noshot{display:flex;align-items:center;justify-content:center;color:var(--chalk);font:500 11px/1.3 var(--mono);text-align:center;padding:8px}
.g h3{font:400 28px/1 var(--anton);text-transform:uppercase}
.g .meta{margin-top:6px;font:400 14px/1.5 var(--inter);overflow-wrap:anywhere}
.g .meta b{font-weight:400;color:var(--label)}
.g .warn{color:var(--red)}
.g .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.g form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g form label{display:flex;flex-direction:column;gap:4px;font:500 11px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
.g form label.wide{grid-column:1 / -1}
.g form input{min-height:40px;padding:8px 10px;border:1px solid var(--ink);background:#fff;font:400 15px/1.2 var(--inter);border-radius:0}
.empty{font:400 15px/1.5 var(--inter);color:var(--label)}
@media (max-width:640px){ .g{grid-template-columns:1fr} .g img,.g .noshot{width:100%;height:auto;aspect-ratio:1} .g form{grid-template-columns:1fr} }
</style>
</head>
<body>
<main>
  <p class="lbl">The Wall Arcade · Admin</p>
  <h1 class="anton">The games</h1>
  <div class="bar">
    <button class="btn blue" id="adminSignIn" type="button">Sign in</button>
    <a class="btn" href="./" target="_blank" rel="noopener">The hub →</a>
    <p class="lbl status" id="status" aria-live="polite"></p>
  </div>
  <div id="board" hidden>
    <h2 class="anton">Pending</h2><div class="list" id="pending"></div>
    <h2 class="anton">On the hub</h2><div class="list" id="live"></div>
    <h2 class="anton">Hidden</h2><div class="list" id="hidden"></div>
  </div>
</main>
<script type="module" src="./admin-page.js"></script>
</body>
</html>
